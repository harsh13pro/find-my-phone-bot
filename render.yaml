services:
  - type: worker
    name: find-my-phone-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MASTER_PASSWORD
        sync: false
      - key: MACRODROID_WEBHOOK_URL
        sync: false
